<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don Fulano Timeline</title>
    <style>
        /* ============ 配置区 ============ */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #7f8c8d;
            --accent-color: #95a5a6;
            --background: transparent;
            --line-color: #bdc3c7;
            --dot-size: 12px;
            --line-width: 2px;
            --spacing: 60px;
            --card-padding: 20px;
            --font-main: inherit;
        }

        /* ============ 核心样式 ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            overflow: hidden;
        }

        body {
            font-family: var(--font-main);
            background: var(--background);
            padding: 40px 20px 20px 20px;
            color: var(--primary-color);
            line-height: 1.6;
            overflow: hidden;
            min-height: 100vh;
        }

        .timeline-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: var(--line-width);
            background: var(--line-color);
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            margin-bottom: var(--spacing);
            display: flex;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }

        .timeline-item:last-child {
            margin-bottom: calc(var(--spacing) * 1.5);
        }

        .timeline-item:nth-child(1) { animation-delay: 0.1s; }
        .timeline-item:nth-child(2) { animation-delay: 0.2s; }
        .timeline-item:nth-child(3) { animation-delay: 0.3s; }
        .timeline-item:nth-child(4) { animation-delay: 0.4s; }
        .timeline-item:nth-child(5) { animation-delay: 0.5s; }
        .timeline-item:nth-child(6) { animation-delay: 0.6s; }

        .timeline-dot {
            position: absolute;
            left: 50%;
            width: var(--dot-size);
            height: var(--dot-size);
            background: var(--primary-color);
            border-radius: 50%;
            transform: translateX(-50%);
            z-index: 2;
            transition: all 0.3s ease;
        }

        .timeline-item:hover .timeline-dot {
            transform: translateX(-50%) scale(1.3);
            background: var(--accent-color);
        }

        .timeline-content {
            width: calc(50% - 40px);
            padding: var(--card-padding);
            background: transparent;
            transition: all 0.3s ease;
        }

        .timeline-item:nth-child(odd) .timeline-content {
            margin-right: auto;
            text-align: right;
        }

        .timeline-item:nth-child(even) .timeline-content {
            margin-left: auto;
            text-align: left;
        }

        .timeline-year {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .timeline-description {
            font-size: 14px;
            color: var(--secondary-color);
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============ 响应式 ============ */
        @media (max-width: 768px) {
            body {
                padding: 40px 15px 20px 15px;
                overflow-y: auto;
                overflow-x: hidden;
            }

            html {
                overflow: auto;
            }

            .timeline-container {
                padding-left: 15px;
                max-width: 100%;
            }

            .timeline-line {
                left: 26px;
            }

            .timeline-dot {
                left: 26px;
            }

            .timeline-content {
                width: calc(100% - 50px);
                margin-left: 50px !important;
                margin-right: 0 !important;
                text-align: left !important;
                padding: 15px;
            }

            .timeline-year {
                font-size: 16px;
            }

            .timeline-description {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 10px 20px 10px;
            }

            .timeline-container {
                padding-left: 5px;
            }

            .timeline-line {
                left: 18px;
            }

            .timeline-dot {
                left: 18px;
            }

            .timeline-content {
                width: calc(100% - 40px);
                margin-left: 40px !important;
                padding: 12px;
            }

            :root {
                --spacing: 40px;
                --card-padding: 12px;
                --dot-size: 10px;
            }

            .timeline-year {
                font-size: 15px;
            }

            .timeline-description {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="timeline-container">
        <div class="timeline-line"></div>
        <div id="timeline"></div>
    </div>

    <script>
        /* ============ 数据配置 ============ */
        const timelineData = [
            {
                year: "1880s",
                description: "Fonseca family begins cultivating agave in Atotonilco, Highlands of Jalisco"
            },
            {
                year: "Late 1800s",
                description: "Family starts planting agave to supply early tequila distillers in the region"
            },
            {
                year: "1970s",
                description: "Family begins considering building their own distillery"
            },
            {
                year: "Mid-1980s",
                description: "Agave shortage prompts acquisition of La Tequileña distillery (NOM 1146)"
            },
            {
                year: "After acquisition",
                description: "Enrique Fonseca travels to Europe to learn distillation techniques"
            },
            {
                year: "Present",
                description: "Enrique and Sergio Fonseca operate with 30+ years of experience"
            }
        ];

        /* ============ 渲染逻辑 ============ */
        const timeline = document.getElementById('timeline');
        
        timelineData.forEach(item => {
            const div = document.createElement('div');
            div.className = 'timeline-item';
            div.innerHTML = `
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                    <div class="timeline-year">${item.year}</div>
                    <div class="timeline-description">${item.description}</div>
                </div>
            `;
            timeline.appendChild(div);
        });

        /* ============ 自适应高度 ============ */
        function updateHeight() {
            const height = document.documentElement.scrollHeight;
            window.parent.postMessage({ type: 'resize', height: height }, '*');
        }
        
        window.addEventListener('load', updateHeight);
        window.addEventListener('resize', updateHeight);
    </script>
</body>
</html>
